[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ict"
version = "0.1.0"
description = "ICT / CRT / Currency Merchant futures trading research library; semantic specs colocated with code under concepts/ and models/"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "plotly",
    "python-frontmatter",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["concepts*", "models*", "infrastructure*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["concepts", "models", "infrastructure"]
